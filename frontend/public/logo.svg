<svg viewBox="0 0 512 512" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Vibrant Orange -->
    <linearGradient id="exactBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7F00" />
      <stop offset="100%" stop-color="#FF6200" />
    </linearGradient>

    <filter id="exactLogoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#FF6200" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Orange Badge with Rounded Left Corners and Right Notch (Exact Match) -->
  <path
    d="M 96 48 
       L 432 48 
       A 20 20 0 0 1 450 76 
       L 366 244 
       Q 354 256 366 268 
       L 450 436 
       A 20 20 0 0 1 432 464 
       L 96 464 
       A 48 48 0 0 1 48 416 
       L 48 96 
       A 48 48 0 0 1 96 48 Z"
    fill="url(#exactBrandGrad)"
    filter="url(#exactLogoShadow)"
  />

  <!-- Three Pure Geometric Concentric "C" Hemispheres (Centered at 250, 256) -->
  <!-- Outer C Arc -->
  <path
    d="M 333 137 A 145 145 0 1 0 333 375"
    stroke="#FFFFFF"
    stroke-width="32"
    stroke-linecap="round"
  />

  <!-- Middle C Arc -->
  <path
    d="M 306 176 A 98 98 0 1 0 306 336"
    stroke="#FFFFFF"
    stroke-width="30"
    stroke-linecap="round"
  />

  <!-- Inner C Arc -->
  <path
    d="M 280 213 A 52 52 0 1 0 280 299"
    stroke="#FFFFFF"
    stroke-width="28"
    stroke-linecap="round"
  />
</svg>
