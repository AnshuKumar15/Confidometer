<svg viewBox="0 0 512 512" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Vibrant Orange -->
    <linearGradient id="exactBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7F00" />
      <stop offset="100%" stop-color="#FF6200" />
    </linearGradient>

    <filter id="exactLogoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#FF6200" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Orange Badge with Pointy End on Left and Balanced Notch -->
  <path
    d="M 416 48 
       L 88 48 
       A 20 20 0 0 0 70 76 
       L 122 244 
       Q 130 256 122 268 
       L 70 436 
       A 20 20 0 0 0 88 464 
       L 416 464 
       A 48 48 0 0 0 464 416 
       L 464 96 
       A 48 48 0 0 0 416 48 Z"
    fill="url(#exactBrandGrad)"
    filter="url(#exactLogoShadow)"
  />

  <!-- Three Pure Geometric Concentric "C" Hemispheres -->
  <!-- Outer C Arc -->
  <path
    d="M 380 153 A 126 126 0 1 0 380 359"
    stroke="#FFFFFF"
    stroke-width="28"
    stroke-linecap="round"
  />

  <!-- Middle C Arc -->
  <path
    d="M 355 186 A 85 85 0 1 0 355 326"
    stroke="#FFFFFF"
    stroke-width="26"
    stroke-linecap="round"
  />

  <!-- Inner C Arc -->
  <path
    d="M 330 220 A 45 45 0 1 0 330 292"
    stroke="#FFFFFF"
    stroke-width="24"
    stroke-linecap="round"
  />
</svg>
